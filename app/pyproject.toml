[tool.flake8]
max-doc-length = 100
max-line-length = 100

[tool.black]
line-length = 119
skip-string-normalization = true
exclude = '''
/(
    migrations
    | env
    | .env
    | venv
    | .venv
    | tests
    | .*test.*\.py
)/
'''

[tool.isort]
line_length = 119
multi_line_output = 3
use_parentheses = true
order_by_type = true
combine_as_imports = true
include_trailing_comma = true
default_section = 'THIRDPARTY'
known_django = 'django'
sections = ['FUTURE','STDLIB','DJANGO','THIRDPARTY','FIRSTPARTY','LOCALFOLDER']
skip = ['migrations', 'tests', 'test_*.py', 'env', '.env', 'venv', '.venv']

[tool.autoflake]
remove-all-unused-imports = true
remove-unused-variables = true
